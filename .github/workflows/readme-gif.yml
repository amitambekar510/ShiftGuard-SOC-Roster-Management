name: Generate README GIF
on:
  push:
    branches: [feature/shiftguard-3-studio]
    paths: ["scripts/generate_demo_gif.py", ".github/workflows/readme-gif.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "Pillow>=10,<13"
      - run: python scripts/generate_demo_gif.py
      - name: Commit animation
        run: |
          git add assets/shiftguard-demo.gif
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: add synthetic ShiftGuard animated walkthrough"
          git push
