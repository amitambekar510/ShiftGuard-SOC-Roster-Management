name: AI Roster tests
on:
  push:
    paths: ["ai_roster.py", "tests/test_ai_roster.py", "examples/team.sample.json", ".github/workflows/ai-roster.yml"]
  pull_request:
    paths: ["ai_roster.py", "tests/test_ai_roster.py", "examples/team.sample.json", ".github/workflows/ai-roster.yml"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python ai_roster.py --config examples/team.sample.json --output /tmp/ai-roster.xlsx --summary /tmp/ai-review.json
