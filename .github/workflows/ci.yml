name: ShiftGuard validation
on:
  push:
    paths: ["shiftguard.py", "tests/**", "requirements.txt", ".github/workflows/ci.yml"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "openpyxl>=3.1,<4"
      - run: python -m unittest discover -s tests -v
      - run: python shiftguard.py --year 2026 --month 10 --output /tmp/shiftguard-example.xlsx
